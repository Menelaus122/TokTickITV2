# TokTickIT — local development stack
#
#   docker compose up -d db        # just PostgreSQL (host-run frontend/backend)
#   docker compose up --build      # full stack: db + backend + frontend
#
# Credentials below match server/.env.example. Inside the compose network the
# database host is "db"; from your host machine it is "localhost".

services:
  db:
    image: postgres:16-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: toktickit-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://toktickit:toktickit@db:5432/toktickit?schema=public"
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: ./client
    container_name: toktickit-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: "http://localhost:3000"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  db_data:
  server_node_modules:
  client_node_modules:
